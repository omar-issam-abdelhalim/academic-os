version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      # Minor and patch updates arrive as two PRs a week instead of one per package.
      runtime-minor-and-patch:
        dependency-type: "production"
        update-types: ["minor", "patch"]
      dev-minor-and-patch:
        dependency-type: "development"
        update-types: ["minor", "patch"]
    # Major versions still arrive one package per PR, so each can be reviewed on its own.
    ignore:
      # Blocked upstream (Nov 2026): eslint-plugin-jsx-a11y does not support ESLint 10,
      # and typescript-eslint does not support TypeScript 7. Remove these once they do.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]
