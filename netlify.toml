[build]
  command = "npm run build"
  publish = "dist"

# SPA fallback — deep links (e.g. /courses/abc/units/def) must resolve to
# index.html so client-side routing can take over, per Stage 2 §8/§37.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers (SECURITY.md §6). CSP has no external script/style/font
# hosts because fonts are self-hosted (src/styles/fonts.ts) and there is no
# CDN dependency anywhere in the stack (ARCHITECTURE.md) — this is what
# keeps the policy this tight without breaking anything.
#
# Deliberate allowance: `style-src 'unsafe-inline'` — a handful of
# components (the desktop week-grid's per-event positioning, progress
# bars) set genuinely dynamic computed values via the `style` attribute,
# which CSP's style-src always requires 'unsafe-inline' for (no
# static nonce/hash is possible for a static site without a server to mint
# one per request). `script-src` has no such allowance and stays 'self'
# only — inline style injection cannot execute JavaScript, so this is a
# narrowly scoped, low-severity trade-off, not a general CSP weakening.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    X-Frame-Options = "DENY"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'"

# index.html and the service worker must always be revalidated so clients
# reliably discover new deployments (ARCHITECTURE.md §PWA Strategy) —
# never long-cached like hashed static assets.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"

# Hashed build assets are safe to cache aggressively — the filename itself
# changes when content changes.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
